# 這個檔案放在 hey-partner/ 子資料夾時「不會」執行。
# 把 hey-partner/ 搬到獨立的 GitHub repo（根目錄）後才會生效。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Lint
        run: npx eslint src/ --max-warnings 0
      - name: Run tests
        run: npx react-scripts test --watchAll=false
      - name: Build
        run: npm run build
        env:
          REACT_APP_GAS_URL: ${{ secrets.REACT_APP_GAS_URL }}
          REACT_APP_WRITE_TOKEN: ${{ secrets.REACT_APP_WRITE_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@v4
